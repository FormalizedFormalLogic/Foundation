name = "Foundation"
defaultTargets = ["Foundation"]

[leanOptions]
pp.unicode.fun = true
weak.linter.flexible = true
weak.linter.refine = true
weak.linter.oldObtain = true
weak.linter.style.multiGoal = true

[[lean_lib]]
name = "Foundation"

# Generators of the zoo diagrams. Kept out of `defaultTargets`: they are built by `just zoo`.
[[lean_lib]]
name = "Zoo"
globs = ["Zoo.+"]

[[lean_exe]]
name = "zoo_arithmetic"
root = "Zoo.Arithmetic"
supportInterpreter = true

[[require]]
scope = "leanprover"
name = "doc-gen4"
rev = "v4.35.0-rc2"

[[require]]
name = "Forgive"
git = "https://github.com/FormalizedFormalLogic/forgive"
rev = "v4.35.0-rc2"

[[require]]
scope = "leanprover-community"
name = "mathlib"
rev = "v4.35.0-rc2"
