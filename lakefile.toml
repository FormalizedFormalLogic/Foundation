name = "Foundation"
defaultTargets = ["Foundation"]
platformIndependent = true

[leanOptions]
pp.unicode.fun = true
weak.linter.flexible = true
weak.linter.refine = true
weak.linter.oldObtain = true
weak.linter.style.multiGoal = true

[[lean_lib]]
name = "Foundation"

[[lean_lib]]
name = "Zoo"
globs = ["Zoo.+"]

[[lean_exe]]
name = "zoo_arithmetic"
root = "Zoo.Arithmetic"
supportInterpreter = true

[[require]]
scope = "leanprover-community"
name = "mathlib"
rev = "v4.34.0"

[[require]]
scope = "leanprover"
name = "doc-gen4"
rev = "v4.34.0"

[[require]]
name = "Forgive"
git = "https://github.com/FormalizedFormalLogic/forgive"
rev = "v4.34.0"
