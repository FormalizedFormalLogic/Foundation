name = "Foundation"
defaultTargets = ["Foundation"]

[leanOptions]
pp.unicode.fun = true
weak.linter.flexible = true
weak.linter.refine = true
weak.linter.oldObtain = true
weak.linter.style.multiGoal = true

[[lean_lib]]
name = "Foundation"

# Generators of the zoo diagrams. Kept out of `defaultTargets`: they are built by `just zoo`.
[[lean_lib]]
name = "Zoo"
globs = ["Zoo.+"]

[[lean_exe]]
name = "zoo_arithmetic"
root = "Zoo.Arithmetic"
supportInterpreter = true

[[require]]
scope = "leanprover"
name = "doc-gen4"
rev = "v4.33.1"

[[require]]
scope = "leanprover-community"
name = "mathlib"
rev = "v4.33.1"

[[require]]
name = "axiom-audit"
git = "https://github.com/SnO2WMaN/axiom-audit"
rev = "827e715d39231df230cb5b1a200be07c151b323b"
