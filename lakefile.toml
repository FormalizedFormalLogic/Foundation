name = "Foundation"
defaultTargets = ["Foundation"]
version = "1.0"

# One published Lake cache then serves every platform, not just CI's Linux. Revisit if a native
# library is added; Lake already drops platform-dependent executable outputs by itself.
platformIndependent = true

[leanOptions]
pp.unicode.fun = true
weak.linter.flexible = true
weak.linter.refine = true
weak.linter.oldObtain = true
weak.linter.style.multiGoal = true

[[lean_lib]]
name = "Foundation"

# Generators of the zoo diagrams. Kept out of `defaultTargets`: they are built by `just zoo`.
[[lean_lib]]
name = "Zoo"
globs = ["Zoo.+"]

[[lean_exe]]
name = "zoo_arithmetic"
root = "Zoo.Arithmetic"
supportInterpreter = true

[[require]]
scope = "leanprover"
name = "doc-gen4"
rev = "v4.34.0"

[[require]]
scope = "leanprover-community"
name = "mathlib"
rev = "v4.34.0"

[[require]]
name = "Forgive"
git = "https://github.com/FormalizedFormalLogic/forgive"
rev = "v4.34.0"
