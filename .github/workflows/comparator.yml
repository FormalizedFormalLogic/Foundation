name: Comparator

# Called once per kernel, each from its own workflow so that each has its own badge.
on:
  workflow_call:
    inputs:
      kernel:
        description: Name of the configuration under `comparator/`.
        required: true
        type: string

permissions:
  contents: read

env:
  LAKE_ARTIFACT_CACHE: true
  LAKE_RESTORE_ARTIFACTS: true
  LAKE_NO_CACHE: true

jobs:
  comparator:
    name: Check with ${{ inputs.kernel }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean

      - run: lake build Foundation
      - run: just comparator ${{ inputs.kernel }}
