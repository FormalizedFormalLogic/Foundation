name: Paranoid kernel check

# `leanchecker-paranoid` takes about 10 minutes and 15 GB of memory, close to the runner's 16 GB,
# so it runs weekly on `master` rather than on every PR.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  LAKE_ARTIFACT_CACHE: true
  LAKE_RESTORE_ARTIFACTS: true
  LAKE_NO_CACHE: true

jobs:
  leanchecker-paranoid:
    name: Check with leanchecker-paranoid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean

      - run: lake build Foundation
      - run: just leanchecker-paranoid
