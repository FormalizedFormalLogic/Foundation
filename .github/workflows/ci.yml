name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Required so these checks also run against the queue's speculative merge
  # commit; otherwise a merge queue entry has no status checks to wait on.
  merge_group:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Print lake and lean version
        run: |
          lake --version
          lean --version

      # Restore project cache
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/Foundation-x86_64-unknown-linux-gnu.tar.gz
          # Cache entries are immutable, so the key includes the commit SHA to always save fresh.
          # Branch isolation is already enforced by the cache's built-in scoping.
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Unpack project cache
        if: hashFiles('.lake/Foundation-x86_64-unknown-linux-gnu.tar.gz') != ''
        run: lake unpack

      - uses: extractions/setup-just@v4

      - name: Build Foundation
        run: lake build Foundation

      - name: Check sorry-freeness and axiom allowlist (axiom-audit)
        run: just axiom-audit

      - name: Build docs
        run: lake build Foundation:docs

      - name: Pack project cache
        run: lake pack
      - name: Save project cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: cache-save
        uses: actions/cache/save@v6
        with:
          path: .lake/Foundation-x86_64-unknown-linux-gnu.tar.gz
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - uses: ts-graphviz/setup-graphviz@v2
      - name: Generate import graph
        run: just import-graph

      - name: Upload lean artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lean-artifacts
          path: |
            .lake/build/doc
            import_graph.png
            import_graph.pdf
            import_graph.html
          retention-days: 1
          include-hidden-files: true

  check-references:
    name: Check references.bib format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Install bibtool
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool
      - name: Check references.bib is formatted
        run: |
          just format-references
          if [ -n "$(git diff)" ]; then
            echo "references.bib is not formatted. Please run 'just format-references' and commit the changes."
            exit 1
          fi

  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Setup elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Generate page
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs:
      - build
      - check-references
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pandoc/actions/setup@v1

      - name: Download lean artifacts
        uses: actions/download-artifact@v8
        with:
          name: lean-artifacts
      - name: Copy from artifacts to pages
        run: |
          cp -r "$GITHUB_WORKSPACE/.lake/build/doc" pages/docs
          cp "$GITHUB_WORKSPACE/import_graph.png" \
             "$GITHUB_WORKSPACE/import_graph.pdf" \
             "$GITHUB_WORKSPACE/import_graph.html" \
             pages/

      - name: Compile README.md to index.html
        run: |
          pandoc \
           README.md \
           --from markdown \
           --to html5 \
           --standalone \
           --katex \
           --metadata title="FormalizedFormalLogic/Foundation" \
           --output pages/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
