name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  LAKE_ARTIFACT_CACHE: true
  LAKE_RESTORE_ARTIFACTS: true
  LAKE_NO_CACHE: true

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean
      - name: Print tool versions
        run: |
          lake --version
          lean --version

      - run: lake build Foundation --wfail
      - run: just forgive

      # A merge-queue commit becomes `master` as is, so publishing it there lets the push run that
      # follows, and the jobs below, restore it instead of compiling it again.
      - name: Save remote cache
        if: >-
          github.event_name == 'merge_group' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          LAKE_CONFIG: lake-cache.toml
          LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          lake build --no-build -o .lake/outputs.jsonl Foundation
          lake cache put \
            .lake/outputs.jsonl \
            --service ffl-upload \
            --repo FormalizedFormalLogic/Foundation

  generate:
    name: Generate import graph and zoo
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean
      - uses: typst-community/setup-typst@v5
      - uses: ts-graphviz/setup-graphviz@v2

      - run: lake build Foundation
      - run: just import-graph
      - run: just zoo

      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            import_graph.png
            import_graph.pdf
            import_graph.html
            pages/zoo
          retention-days: 1

  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    needs: build
    # Docs are only deployed from `master`; `workflow_dispatch` lets a branch try this job out.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: ./.github/actions/setup-lean

      # doc-gen's database of core and dependency modules takes most of its ~20 minutes to fill,
      # and only changes with the toolchain and the dependencies. `fromDb` renders just the import
      # closure of `Foundation`, so rows left behind by removed modules never reach the output.
      - name: Restore doc-gen database
        uses: actions/cache@v6
        with:
          path: |
            .lake/build/api-docs.db*
            .lake/build/doc-data
          key: doc-gen-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: doc-gen-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - run: lake build Foundation
      - run: just docs

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: .lake/build/doc
          retention-days: 1
          include-hidden-files: true

  check-references:
    name: Check references.bib format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Install bibtool
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool
      - name: Check references.bib is formatted
        run: |
          just format-references
          if [ -n "$(git diff)" ]; then
            echo "references.bib is not formatted. Please run 'just format-references' and commit the changes."
            exit 1
          fi

  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: Setup elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Generate page
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs:
      - build
      - generate
      - docs
      - check-references
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pandoc/actions/setup@v1

      # `pages/zoo` is unpacked in place, the import graph at the root.
      - uses: actions/download-artifact@v8
        with:
          name: generated
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: pages/docs
      - name: Copy import graph to pages
        run: cp import_graph.png import_graph.pdf import_graph.html pages/

      - name: Compile README.md to index.html
        run: |
          pandoc \
           README.md \
           --from markdown \
           --to html5 \
           --standalone \
           --katex \
           --metadata title="FormalizedFormalLogic/Foundation" \
           --output pages/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
